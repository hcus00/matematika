<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hatványvadász – azonosságok gyakorlása</title>
<style>
:root{--bg:#f3f5fb;--card:#fff;--tx:#1b2240;--mu:#5d678a;--pr:#5b4bdb;--prt:#fff;--ok:#12805c;--okb:#dcf5ea;--no:#c0392b;--nob:#fde4e1;--bd:#dfe3f1;--ac:#f5a30a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12152a;--card:#1d2142;--tx:#eef0ff;--mu:#a3abd1;--pr:#8f82ff;--prt:#12152a;--ok:#4fd6a0;--okb:#143a2d;--no:#ff8a7a;--nob:#43201d;--bd:#2f3560;--ac:#ffc04d;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12152a;--card:#1d2142;--tx:#eef0ff;--mu:#a3abd1;--pr:#8f82ff;--prt:#12152a;--ok:#4fd6a0;--okb:#143a2d;--no:#ff8a7a;--nob:#43201d;--bd:#2f3560;--ac:#ffc04d;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.45}
main{max-width:720px;margin:0 auto;padding:16px}
h1{font-size:1.7rem;margin:.2em 0}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:18px;margin:12px 0}
.mu{color:var(--mu)}
.hide{display:none}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 14px}
.chip{border:2px solid var(--bd);background:var(--card);color:var(--tx);border-radius:999px;padding:8px 14px;font:inherit;cursor:pointer}
.chip.on{border-color:var(--pr);background:var(--pr);color:var(--prt);font-weight:600}
.btn{background:var(--pr);color:var(--prt);border:0;border-radius:12px;padding:13px 22px;font:inherit;font-weight:700;font-size:1.05rem;cursor:pointer}
.btn:hover{filter:brightness(1.08)}
.hud{display:flex;gap:10px;flex-wrap:wrap;align-items:center;font-weight:600}
.pill{background:var(--card);border:1px solid var(--bd);border-radius:999px;padding:4px 12px}
.bar{height:10px;background:var(--bd);border-radius:9px;overflow:hidden;margin:10px 0}
.bar i{display:block;height:100%;width:0;background:var(--ac);transition:width .3s}
.tag{font-size:.85rem;color:var(--mu)}
.expr{font-size:1.7rem;text-align:center;padding:22px 6px;overflow-x:auto;font-family:"Cambria Math",Cambria,Georgia,serif}
sup{font-size:.62em;line-height:0}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 .12em}
.nu{border-bottom:2px solid currentColor;padding:0 .3em}.de{padding:0 .3em}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:520px){.opts{grid-template-columns:1fr}}
.opt{background:var(--card);color:var(--tx);border:2px solid var(--bd);border-radius:12px;padding:14px 8px;font-size:1.3rem;font-family:"Cambria Math",Cambria,Georgia,serif;cursor:pointer;min-height:64px;overflow-x:auto}
.opt:hover:not(:disabled){border-color:var(--pr)}
.opt.ok{border-color:var(--ok);background:var(--okb)}
.opt.no{border-color:var(--no);background:var(--nob)}
.opt:disabled{cursor:default;color:var(--tx)}
.fb{border-radius:14px;padding:14px;margin-top:14px}
.fb.ok{background:var(--okb);border:1px solid var(--ok)}.fb.no{background:var(--nob);border:1px solid var(--no)}
.fb h3{margin:0 0 6px}
.ans{font-size:1.4rem;font-family:"Cambria Math",Cambria,Georgia,serif;margin:6px 0 10px;overflow-x:auto}
.fb ol{margin:6px 0 0;padding-left:22px}.fb li{margin:6px 0;font-family:"Cambria Math",Cambria,Georgia,serif;font-size:1.08rem}
.big{font-size:2.6rem;text-align:center;margin:0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center;margin:12px 0}
.stats b{display:block;font-size:1.5rem}
.top h1{cursor:pointer}.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.blk h2,.th h2{margin:.1em 0 .2em}
.bt{display:flex;align-items:center;gap:8px;margin:7px 0;font-size:.95rem}.bt span:first-child{flex:0 0 42%}.bt span:last-child{flex:0 0 88px;text-align:right}.bt .bar{flex:1;margin:0}
.th h3{margin:1.1em 0 .2em}.rule{background:var(--bg);border-left:4px solid var(--pr);padding:8px 12px;border-radius:8px;margin:6px 0;font-family:"Cambria Math",Cambria,Georgia,serif;font-size:1.12rem;overflow-x:auto}
.th p,.th li{font-family:"Cambria Math",Cambria,Georgia,serif;font-size:1.05rem}.th ul{padding-left:20px}.warn{color:var(--no)}
</style>
</head>
<body>
<main>
<header class="top"><h1 id="logo">⚡ Hatványvadász</h1></header>
<div id="home">
 <p class="mu">Válassz gyakorlót, nézd meg az eredményeidet, vagy olvasd át az elméleti összefoglalót!</p>
 <div id="blocks"></div>
 <div class="card"><h2 style="margin-top:0">📊 Eredményeim</h2><div id="res"></div><p><button class="chip" id="rst">Eredmények törlése</button></p></div>
</div>
<div id="start" class="hide card">
 <button class="chip" id="back">← Főoldal</button>
 <h2 id="stt"></h2>
 <b>Nehézség</b><div class="chips" id="lv"></div>
 <b>Témák</b><div class="chips" id="tp"></div>
 <button class="btn" id="go">Indítás</button>
</div>
<div id="theory" class="hide"></div>
<div id="play" class="hide">
 <div class="hud"><button class="chip" id="quit">✕ Kilépés</button><span class="pill" id="hq"></span><span class="pill">⭐ <span id="hs">0</span> XP</span><span class="pill">🔥 <span id="hst">0</span></span></div>
 <div class="bar"><i id="pb"></i></div>
 <div class="card">
  <div class="tag" id="tt"></div>
  <div class="expr" id="ex"></div>
  <div class="opts" id="op"></div>
  <div id="fb"></div>
 </div>
</div>
<div id="end" class="hide card"></div>
</main>
<script>
const $=s=>document.querySelector(s);
const sup=s=>`<sup>${s}</sup>`;
const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[R(0,a.length-1)];
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=R(0,i);[a[i],a[j]]=[a[j],a[i]]}return a};
const pw=(b,e)=>(e===1||e==='1')?b:(e===0||e==='0')?'1':b+sup(e);
const lin=(a,b,v='n')=>{let s=a===0?'':a===1?v:a===-1?'-'+v:a+v;if(b!==0||a===0)s+=(b<0||a===0?'':'+')+b;return s};
const mono=(c,t)=>{const body=t.filter(x=>x[1]!==0&&x[1]!=='0').map(([v,e])=>pw(v,e)).join('');if(!body)return''+c;return(c===1?'':c===-1?'-':c)+body};
const poly=ts=>ts.filter(x=>x[0]!==0).map(([c,t],i)=>{const m=mono(Math.abs(c),t);return i===0?(c<0?'-':'')+m:(c<0?' − ':' + ')+m}).join('');
const frac=(n,d)=>`<span class="fr"><span class="nu">${n}</span><span class="de">${d}</span></span>`;
const par=(s,e)=>`(${s})${sup(e)}`;
const V=['a','b','x','y','z','m','p','t','c','d'];
const two=()=>{const a=pick(V);let b;do b=pick(V);while(b===a);return[a,b]};
const fmt=h=>h.replace(/(<[^>]*>)|-/g,(m,t)=>t||'−');

/* ---- feladatgenerátorok: {q,a,w:[rossz válaszok],r:szabály,s:[lépések]} ---- */
const rMul=`a${sup('m')} · a${sup('n')} = a${sup('m+n')} (az alap marad, a kitevők összeadódnak)`;
const rDiv=`a${sup('m')} : a${sup('n')} = a${sup('m−n')} (a kitevők kivonódnak, a ≠ 0)`;
const rPP=`(a${sup('m')})${sup('n')} = a${sup('m·n')} (a kitevők szorzódnak)`;
const rPR=`(a·b)${sup('n')} = a${sup('n')} · b${sup('n')} (minden tényezőt hatványozunk)`;
const rFR=`(a/b)${sup('n')} = a${sup('n')} / b${sup('n')} (a számlálót és a nevezőt is hatványozzuk, b ≠ 0)`;

function mulE(){const L=pick(V),m=R(2,8),n=R(2,8),a=pw(L,m+n);
 return{q:`${pw(L,m)} · ${pw(L,n)}`,a,w:[pw(L,m*n),pw(L,Math.abs(m-n)),pw(L,m+n+1),pw(L,m+n-1),'2'+a],r:rMul,
 s:[`${pw(L,m)} · ${pw(L,n)} = ${pw(L,m+'+'+n)}`,`${pw(L,m+'+'+n)} = ${a}`]}}
function mulH1(){const[x,y]=two(),c1=R(2,6),c2=R(2,5),m=R(1,5),n=R(2,5),k=R(1,4),j=R(1,4);
 const a=mono(c1*c2,[[x,m+n],[y,k+j]]);
 return{q:`(${mono(c1,[[x,m],[y,k]])}) · (${mono(c2,[[x,n],[y,j]])})`,a,
 w:[mono(c1+c2,[[x,m+n],[y,k+j]]),mono(c1*c2,[[x,m*n],[y,k*j]]),mono(c1*c2,[[x,m+n],[y,k*j]]),mono(c1*c2,[[x,m+n],[y,k]])],r:rMul,
 s:[`Az együtthatókat összeszorozzuk: ${c1} · ${c2} = ${c1*c2}`,`${x} kitevői: ${m} + ${n} = ${m+n}; ${y} kitevői: ${k} + ${j} = ${k+j}`,`Eredmény: ${a}`]}}
function mulH2(){const L=pick(V),v=pick(['n','k']),a1=R(1,6),b1=R(-4,6),a=pw(L,lin(2,a1+b1,v));
 return{q:`${pw(L,lin(1,a1,v))} · ${pw(L,lin(1,b1,v))}`,a,
 w:[pw(L,lin(1,a1+b1,v)),pw(L,lin(2,a1*b1,v)),pw(L,lin(2,a1+b1+1,v)),pw(L,lin(2,a1-b1,v)),pw(L,lin(1,a1*b1,v))],r:rMul,
 s:[`Az alap ugyanaz (${L}), ezért a kitevőket összeadjuk: (${lin(1,a1,v)}) + (${lin(1,b1,v)})`,`${v} + ${v} = 2${v}; ${a1} + (${b1}) = ${a1+b1}`,`Eredmény: ${a}`]}}
function divE(){const L=pick(V),n=R(2,5),m=n+R(1,5),a=pw(L,m-n);
 return{q:`${pw(L,m)} : ${pw(L,n)}`,a,w:[pw(L,m+n),pw(L,m*n),pw(L,m-n+1),pw(L,m-n-1),pw(L,n-m)],r:rDiv,
 s:[`${pw(L,m)} : ${pw(L,n)} = ${pw(L,m+'−'+n)}`,`${pw(L,m+'−'+n)} = ${a}`]}}
function divH1(){const[x,y]=two(),d=R(2,5),qc=R(2,6),n=R(1,3),m=n+R(1,4),j=R(1,3),k=j+R(1,4);
 const a=mono(qc,[[x,m-n],[y,k-j]]);
 return{q:frac(mono(d*qc,[[x,m],[y,k]]),mono(d,[[x,n],[y,j]])),a,
 w:[mono(d*qc-d,[[x,m-n],[y,k-j]]),mono(qc,[[x,m+n],[y,k+j]]),mono(qc,[[x,m-n],[y,k+j]]),mono(qc,[[x,m-n],[y,k]])],r:rDiv,
 s:[`Az együtthatókat osztjuk: ${d*qc} : ${d} = ${qc}`,`${x} kitevői: ${m} − ${n} = ${m-n}; ${y} kitevői: ${k} − ${j} = ${k-j}`,`Eredmény: ${a}`]}}
function divH2(){const L=pick(V),v=pick(['n','k']),d=R(2,5),qc=R(2,5),a1=R(3,9),b1=R(-3,2),a=mono(qc,[[L,a1-b1]]);
 return{q:frac(mono(d*qc,[[L,lin(1,a1,v)]]),mono(d,[[L,lin(1,b1,v)]])),a,
 w:[mono(qc,[[L,a1+b1]]),mono(qc,[[L,lin(2,a1-b1,v)]]),mono(d*qc-d,[[L,a1-b1]]),mono(qc,[[L,b1-a1]])],r:rDiv,
 s:[`Az együtthatók: ${d*qc} : ${d} = ${qc}`,`A kitevők kivonódnak, a második kitevőt zárójelben kell kivonni: (${lin(1,a1,v)}) − (${lin(1,b1,v)}) = ${v} + ${a1} − ${v} ${b1<0?'+ '+(-b1):'− '+b1} = ${a1-b1}`,`Eredmény: ${a}`]}}
function ppE(){const L=pick(V),m=R(2,6),n=R(2,5),a=pw(L,m*n);
 return{q:par(pw(L,m),n),a,w:[pw(L,m+n),pw(L,m*n+m),pw(L,Math.abs(m-n)),pw(L,m*n-1)],r:rPP,
 s:[`${par(pw(L,m),n)} = ${pw(L,m+'·'+n)}`,`${pw(L,m+'·'+n)} = ${a}`]}}
function ppH1(){const L=pick(V),v=pick(['n','k']),a1=R(1,5),b=R(2,4),a=pw(L,lin(b,a1*b,v));
 return{q:par(pw(L,lin(1,a1,v)),b),a,
 w:[pw(L,lin(1,a1*b,v)),pw(L,lin(b,a1+b,v)),pw(L,lin(b,a1,v)),pw(L,lin(1,a1+b,v))],r:rPP,
 s:[`A kitevőket összeszorozzuk: (${lin(1,a1,v)}) · ${b}`,`Minden tagot szorzunk (zárójel felbontása): ${b}${v} + ${a1*b}`,`Eredmény: ${a}`]}}
function ppH2(){const L=pick(V),m=R(2,3),n=R(2,3),p=R(2,3),a=pw(L,m*n*p);
 return{q:par(par(pw(L,m),n),p),a,w:[pw(L,m+n+p),pw(L,m*n+p),pw(L,m+n*p),pw(L,m*n*p+1)],r:rPP,
 s:[`Belülről kifelé haladunk: ${par(pw(L,m),n)} = ${pw(L,m*n)}`,`${par(pw(L,m*n),p)} = ${pw(L,m*n+'·'+p)} = ${a}`]}}
function prE(){const[x,y]=two(),n=R(2,5),a=pw(x,n)+pw(y,n);
 return{q:par(x+y,n),a,w:[x+pw(y,n),pw(x,n)+y,n+x+y,pw(x,n)+'+'+pw(y,n)],r:rPR,
 s:[`Mindkét tényezőt a ${n}. hatványra emeljük: ${par(x+y,n)} = ${pw(x,n)} · ${pw(y,n)}`,`Eredmény: ${a}`]}}
function prH(){const[x,y]=two(),c=pick([-3,-2,2,3,4]),n=pick([2,3]),a1=R(1,3),b1=R(1,3),a=mono(c**n,[[x,a1*n],[y,b1*n]]);
 return{q:par(mono(c,[[x,a1],[y,b1]]),n),a,
 w:[mono(c*n,[[x,a1*n],[y,b1*n]]),mono(c**n,[[x,a1+n],[y,b1+n]]),mono(c**n,[[x,a1*n],[y,b1]]),mono(Math.abs(c**n),[[x,a1*n],[y,b1*n]]),mono(c**n,[[x,a1*n],[y,b1+n]])],r:rPR,
 s:[`Az együtthatót is hatványozzuk: (${c})${sup(n)} = ${c**n}`,`${x}: ${par(pw(x,a1),n)} = ${pw(x,a1*n)}; ${y}: ${par(pw(y,b1),n)} = ${pw(y,b1*n)}`,`Eredmény: ${a}`]}}
function frE(){const[x,y]=two(),n=R(2,5),a=frac(pw(x,n),pw(y,n));
 return{q:par(frac(x,y),n),a,w:[frac(pw(x,n),y),frac(x,pw(y,n)),frac(n+x,n+y),frac(pw(x,2*n),pw(y,2*n))],r:rFR,
 s:[`A számlálót és a nevezőt is a ${n}. hatványra emeljük`,`Eredmény: ${a}`]}}
function frH(){const[x,y]=two(),c=pick([2,3,4,5]),d=pick([2,3,4,5]),n=pick([2,3]),a1=R(1,3),b1=R(1,3);
 const a=frac(mono(c**n,[[x,a1*n]]),mono(d**n,[[y,b1*n]]));
 return{q:par(frac(mono(c,[[x,a1]]),mono(d,[[y,b1]])),n),a,
 w:[frac(mono(c*n,[[x,a1*n]]),mono(d*n,[[y,b1*n]])),frac(mono(c**n,[[x,a1*n]]),mono(d,[[y,b1*n]])),frac(mono(c**n,[[x,a1]]),mono(d**n,[[y,b1]])),frac(mono(c**n,[[x,a1*n]]),mono(d**n,[[y,b1+n]]))],r:rFR,
 s:[`Számláló: ${par(mono(c,[[x,a1]]),n)} = ${mono(c**n,[[x,a1*n]])}`,`Nevező: ${par(mono(d,[[y,b1]]),n)} = ${mono(d**n,[[y,b1*n]])}`,`Eredmény: ${a}`]}}

function nota(hard,kind){
 kind=kind||pick(['p','m','d']);let A,B;
 if(hard){A=[R(2,5),[[pick(['x','a','m']),R(1,2)]]];const w=pick(['y','b','n']);B=[R(2,6),[[w,R(1,2)]]]}
 else{A=[1,[[pick(['x','a','m','y']),1]]];B=[R(2,9),[]]}
 const sq=t=>[t[0]*t[0],t[1].map(([v,e])=>[v,e*2])];
 const A2=sq(A),B2=sq(B),pr=[A[0]*B[0],A[1].concat(B[1])];
 const sA=poly([A]),sB=poly([B]),pa=`(${sA})${sup(2)}`,pb=`(${sB})${sup(2)}`;
 if(kind==='d'){const ans=poly([A2,[-B2[0],B2[1]]]);
  return{q:`(${poly([A,B])}) · (${poly([A,[-B[0],B[1]]])})`,a:ans,
  w:[poly([A2,B2]),poly([A2,[-2*pr[0],pr[1]],B2]),poly([[-A2[0],A2[1]],B2]),poly([A2,[-B[0],B[1]]])],
  r:`(a + b) · (a − b) = a${sup(2)} − b${sup(2)}`,
  s:[`Itt a = ${sA}, b = ${sB}`,`${pa} − ${pb}`,`Eredmény: ${ans}`]}}
 const s=kind==='p'?1:-1,m=[2*s*pr[0],pr[1]],ans=poly([A2,m,B2]);
 const sg=s>0?'+':'−';
 return{q:`(${poly([A,[s*B[0],B[1]]])})${sup(2)}`,a:ans,
 w:[poly([A2,B2]),poly([A2,[-m[0],m[1]],B2]),poly([A2,[s*pr[0],pr[1]],B2]),poly([A2,m,[-B2[0],B2[1]]])],
 r:`(a ${sg} b)${sup(2)} = a${sup(2)} ${sg} 2ab + b${sup(2)}`,
 s:[`Itt a = ${sA}, b = ${sB}`,`${pa} ${sg} 2 · (${sA}) · (${sB}) + ${pb}`,`Eredmény: ${ans}`]}}

const rNG=`a${sup('0')} = 1 (a ≠ 0) és a${sup('−n')} = 1 / a${sup('n')}`;
function ngE(){const[x,y]=two(),m=R(2,7),n=R(2,7),c=R(2,5),k=R(1,3),v=R(0,2);
 if(v===0){const a=pw(x,m-n);return{q:`${pw(x,m)} · ${pw(x,-n)}`,a,w:[pw(x,m+n),pw(x,n-m),pw(x,-(m+n)),pw(x,-m*n)],r:rMul,
  s:[`Azonos alap, a kitevők összeadódnak: ${m} + (−${n}) = ${m-n}`,`Eredmény: ${a}`]}}
 if(v===1){const e=mono(c,[[x,m],[y,k]]);return{q:par(e,0),a:'1',w:['0',''+c,e,pw(x,m)],r:rNG,
  s:[`Minden nullától különböző kifejezés nulladik hatványa 1 (x ≠ 0, y ≠ 0)`,`Eredmény: 1`]}}
 const a=frac('1',pw(x,n));
 return{q:pw(x,-n),a,w:[frac('-1',pw(x,n)),pw(x,n),'-'+pw(x,n),frac('1',n+x)],r:rNG,
  s:[`A negatív kitevő a reciprokot jelenti: ${pw(x,-n)} = 1 / ${pw(x,n)}`,`Eredmény: ${a}`]}}
function ngH1(){const[x,y]=two(),d=R(2,5),qc=R(2,6),m=R(1,3),n=m+R(1,4),j=R(1,3),k=j+R(1,4);
 const a=mono(qc,[[x,m-n],[y,k-j]]);
 return{q:frac(mono(d*qc,[[x,m],[y,k]]),mono(d,[[x,n],[y,j]])),a,
 w:[mono(qc,[[x,n-m],[y,k-j]]),mono(qc,[[x,m+n],[y,k-j]]),mono(d*qc-d,[[x,m-n],[y,k-j]]),mono(qc,[[x,m-n],[y,j-k]])],r:rDiv+'; '+rNG,
 s:[`Az együtthatók: ${d*qc} : ${d} = ${qc}`,`${x} kitevői: ${m} − ${n} = ${m-n} (negatív is lehet!); ${y} kitevői: ${k} − ${j} = ${k-j}`,`Eredmény: ${a}`]}}
function ngH2(){const[x,y]=two(),n=R(2,3),a1=R(1,3),b1=R(1,3),a=pw(x,a1*n)+pw(y,-b1*n);
 return{q:par(pw(x,a1)+pw(y,-b1),n),a,w:[pw(x,a1*n)+pw(y,b1*n),pw(x,a1+n)+pw(y,-b1-n),pw(x,a1*n)+pw(y,-b1-n),pw(x,-a1*n)+pw(y,-b1*n)],r:rPR+'; '+rPP,
 s:[`Minden tényezőt hatványozunk, a kitevők szorzódnak`,`${x}: ${a1}·${n} = ${a1*n}; ${y}: (−${b1})·${n} = ${-b1*n}`,`Eredmény: ${a}`]}}
function ngH3(){const L=pick(V),v=pick(['n','k']),a1=R(-4,4),b1=R(-3,5),a=pw(L,a1+b1);
 return{q:`${pw(L,lin(1,a1,v))} · ${pw(L,lin(-1,b1,v))}`,a,w:[pw(L,lin(1,a1+b1,v)),pw(L,lin(2,a1+b1,v)),pw(L,lin(-2,a1+b1,v)),pw(L,a1-b1),pw(L,-(a1+b1)||7)],r:rMul,
 s:[`Az alap azonos, a kitevők összeadódnak: (${lin(1,a1,v)}) + (${lin(-1,b1,v)})`,`A ${v} és a −${v} kiesik: ${a1} + (${b1}) = ${a1+b1}`,`Eredmény: ${a}`+(a1+b1===0?' (nulladik hatvány!)':'')]}}

const nt=(l,k)=>({n:l,i:'Bontsd fel a zárójelet!',g:[[()=>nota(0,k)],[()=>nota(1,k)]]});
const T={
 mul:{n:'Szorzás',i:'Végezd el a szorzást, add meg a legegyszerűbb alakot!',g:[[mulE],[mulH1,mulH2]]},
 div:{n:'Osztás',i:'Végezd el az osztást, add meg a legegyszerűbb alakot!',g:[[divE],[divH1,divH2]]},
 pp:{n:'Hatvány hatványozása',i:'Hatványozd, add meg a legegyszerűbb alakot!',g:[[ppE],[ppH1,ppH2]]},
 pr:{n:'Szorzat hatványozása',i:'Hatványozd, add meg a legegyszerűbb alakot!',g:[[prE],[prH]]},
 fr:{n:'Tört hatványozása',i:'Hatványozd, add meg a legegyszerűbb alakot!',g:[[frE],[frH]]},
 ng:{n:'Negatív és nulladik kitevő',i:'Egyszerűsítsd! (a nevezők ≠ 0)',g:[[ngE],[ngH1,ngH2,ngH3]]},
 np:nt('(a + b)²','p'),nm:nt('(a − b)²','m'),nd:nt('(a + b)(a − b)','d')
};
const B={
 pw:{n:'Hatványazonosságok',e:'🧮',d:'Szorzás, osztás, hatványozás, szorzat és tört hatványozása, negatív és nulladik kitevő.',t:['mul','div','pp','pr','fr','ng']},
 no:{n:'Nevezetes azonosságok',e:'✨',d:'Két szám összegének és különbségének négyzete, összeg és különbség szorzata.',t:['np','nm','nd']}
};
const LV={e:'Könnyű',h:'Nehéz',m:'Vegyes'};
let lv='m',cb='pw',G={};const sels={pw:new Set(B.pw.t),no:new Set(B.no.t)};
const SK='hv_stats_v2';
const load=()=>{try{return JSON.parse(localStorage.getItem(SK))||{}}catch(e){return{}}};
const save=o=>{try{localStorage.setItem(SK,JSON.stringify(o))}catch(e){}};
const show=id=>{['home','start','theory','play','end'].forEach(x=>$('#'+x).classList.toggle('hide',x!==id));window.scrollTo(0,0)};

function home(){
 show('home');const st=load();
 $('#blocks').innerHTML=Object.entries(B).map(([k,b])=>{
  let ok=0,n=0;b.t.forEach(t=>{const x=(st.t||{})[t];if(x){ok+=x[0];n+=x[1]}});
  const bb=(st.b||{})[k]||{r:0,best:0};
  return`<div class="card blk"><h2>${b.e} ${b.n}</h2><div class="mu">${b.d}</div>
  <div style="margin-top:8px">Körök: <b>${bb.r}</b> · Pontosság: <b>${n?Math.round(ok/n*100)+'%':'–'}</b> · Legjobb: <b>${bb.best} XP</b></div>
  <div class="row"><button class="btn" data-p="${k}">Gyakorlás</button><button class="chip" data-th="${k}">📖 Elmélet</button></div></div>`}).join('');
 let any=false;
 $('#res').innerHTML=Object.entries(B).map(([k,b])=>`<b>${b.n}</b>`+b.t.map(t=>{
  const x=(st.t||{})[t],p=x?Math.round(x[0]/x[1]*100):0;if(x)any=true;
  return`<div class="bt"><span>${T[t].n}</span><div class="bar"><i style="width:${p}%"></i></div><span>${x?p+'% ('+x[0]+'/'+x[1]+')':'–'}</span></div>`}).join('')).join('<br>')
  +(any?'':'<p class="mu">Még nincs eredményed – kezdj egy kört!</p>');
}
$('#blocks').onclick=e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.p)setup(b.dataset.p);if(b.dataset.th)theory(b.dataset.th)};
$('#rst').onclick=()=>{if(confirm('Biztosan törlöd az összes eredményt?')){save({});home()}};
$('#logo').onclick=home;$('#back').onclick=home;$('#quit').onclick=home;
function setup(k){cb=k;$('#stt').textContent=B[k].e+' '+B[k].n;chips();show('start')}
function chips(){
 $('#lv').innerHTML=Object.entries(LV).map(([k,v])=>`<button class="chip ${k===lv?'on':''}" data-l="${k}">${v}</button>`).join('');
 $('#tp').innerHTML=B[cb].t.map(k=>`<button class="chip ${sels[cb].has(k)?'on':''}" data-t="${k}">${T[k].n}</button>`).join('');
}
$('#lv').onclick=e=>{const l=e.target.dataset.l;if(l){lv=l;chips()}};
$('#tp').onclick=e=>{const t=e.target.dataset.t,s=sels[cb];if(!t)return;if(s.has(t)){if(s.size>1)s.delete(t)}else s.add(t);chips()};
$('#go').onclick=()=>{G={i:0,xp:0,st:0,ms:0,ok:0,last:'',b:cb};show('play');next()};

function theory(k){
 cb=k;const r=s=>`<div class="rule">${s}</div>`,S=sup;
 let h=`<div class="card th"><button class="chip" data-a="home">← Főoldal</button><h2>${B[k].e} ${B[k].n} – összefoglaló</h2>`;
 if(k==='pw')h+=`<h3>Azonos alapú hatványok szorzása</h3>${r(rMul)}<p>Példa: x${S(3)} · x${S(4)} = x${S(7)}; 3a${S(2)} · 4a${S(5)} = 12a${S(7)}</p>
 <h3>Azonos alapú hatványok osztása</h3>${r(rDiv)}<p>Példa: x${S(7)} : x${S(4)} = x${S(3)}; 12y${S(9)} : 4y${S(2)} = 3y${S(7)}</p>
 <h3>Hatvány hatványozása</h3>${r(rPP)}<p>Példa: (x${S(3)})${S(4)} = x${S(12)}</p>
 <h3>Szorzat hatványozása</h3>${r(rPR)}<p>Példa: (2xy${S(2)})${S(3)} = 8x${S(3)}y${S(6)} (az együtthatót is hatványozzuk!)</p>
 <h3>Tört hatványozása</h3>${r(rFR)}<p>Példa: (${frac('2x','3y')})${S(2)} = ${frac('4x'+S(2),'9y'+S(2))}</p>
 <h3>Nulladik és negatív kitevő</h3>${r('a'+S(0)+' = 1 (a ≠ 0)')}${r('a'+S('−n')+' = 1 / a'+S('n')+' (a ≠ 0)')}
 <p>Miért igaz? x${S(5)} : x${S(5)} = 1, másrészt a kitevők kivonásával x${S(0)}. Példa: x${S('−2')} = 1/x${S(2)}; (2/3)${S('−2')} = (3/2)${S(2)} = 9/4; (5x${S(2)})${S(0)} = 1.</p>
 <h3 class="warn">Gyakori hibák</h3><ul><li>x${S(3)} · x${S(4)} ≠ x${S(12)} – szorzásnál a kitevők összeadódnak.</li><li>(2x)${S(3)} ≠ 2x${S(3)} – a 2-t is a harmadikra kell emelni: 8x${S(3)}.</li><li>(x${S(2)})${S(3)} ≠ x${S(5)} – hatványozásnál a kitevők szorzódnak.</li><li>Kitevők kivonásánál zárójelezz: (n+5) − (n−2) = n+5−n+2 = 7.</li><li>x${S('−2')} nem negatív szám, hanem 1/x${S(2)}.</li></ul>`;
 else h+=`<h3>Összeg négyzete</h3>${r('(a + b)'+S(2)+' = a'+S(2)+' + 2ab + b'+S(2))}<p>Példa: (2x + 3)${S(2)} = 4x${S(2)} + 12x + 9</p>
 <h3>Különbség négyzete</h3>${r('(a − b)'+S(2)+' = a'+S(2)+' − 2ab + b'+S(2))}<p>Példa: (3a − 2b)${S(2)} = 9a${S(2)} − 12ab + 4b${S(2)}</p>
 <h3>Összeg és különbség szorzata</h3>${r('(a + b) · (a − b) = a'+S(2)+' − b'+S(2))}<p>Példa: (5x + 4)(5x − 4) = 25x${S(2)} − 16</p>
 <h3>Visszafelé is használható</h3><p>x${S(2)} − 49 = (x + 7)(x − 7). Fejszámolásnál is hasznos: 51${S(2)} = (50 + 1)${S(2)} = 2601; 49 · 51 = (50 − 1)(50 + 1) = 2499.</p>
 <h3 class="warn">Gyakori hibák</h3><ul><li>(a + b)${S(2)} ≠ a${S(2)} + b${S(2)} – a középső tag, a 2ab nem maradhat el.</li><li>A középső tag 2ab, nem csak ab.</li><li>(a − b)${S(2)} végén +b${S(2)} áll, nem −b${S(2)}.</li><li>(a + b)(a − b)-nél nincs középső tag, és a végeredmény különbség.</li><li>Ha a tagok együtthatósak, azt is négyzetre kell emelni: (3x)${S(2)} = 9x${S(2)}.</li></ul>`;
 $('#theory').innerHTML=h+`<p><button class="btn" data-a="go">Gyakorlás indítása</button></p></div>`;show('theory');
}
$('#theory').onclick=e=>{const a=e.target.dataset.a;if(a==='home')home();if(a==='go')setup(cb)};

function make(){
 for(let tries=0;tries<30;tries++){
  const t=pick([...sels[G.b]]),l=lv==='m'?pick(['e','h']):lv,q=pick(T[t].g[l==='e'?0:1])();
  const w=[...new Set(shuf(q.w).map(fmt))].filter(x=>x!==fmt(q.a));
  if(w.length>=3&&fmt(q.q)!==G.last){q.t=t;q.l=l;q.opts=shuf([fmt(q.a),...w.slice(0,3)]);G.last=fmt(q.q);return q}
 }
}
function next(){
 if(G.i>=10)return finish();
 const q=G.q=make();G.i++;
 $('#hq').textContent=`${G.i}. / 10`;$('#hs').textContent=G.xp;$('#hst').textContent=G.st;
 $('#pb').style.width=((G.i-1)*10)+'%';
 $('#tt').textContent=`${T[q.t].n} · ${q.l==='e'?'könnyű':'nehéz'} · ${T[q.t].i}`;
 $('#ex').innerHTML=fmt(q.q);$('#fb').innerHTML='';
 $('#op').innerHTML=q.opts.map((o,i)=>`<button class="opt" data-i="${i}">${o}</button>`).join('');
}
$('#op').onclick=e=>{
 const b=e.target.closest('.opt');if(!b||b.disabled)return;
 const q=G.q,ca=fmt(q.a),good=q.opts[+b.dataset.i]===ca;
 document.querySelectorAll('.opt').forEach(x=>{x.disabled=true;if(x.innerHTML===ca)x.classList.add('ok')});
 let pts=0;
 if(good){G.st++;G.ms=Math.max(G.ms,G.st);G.ok++;pts=(q.l==='e'?10:20)+Math.min(G.st-1,5)*2;G.xp+=pts}else{b.classList.add('no');G.st=0}
 const st=load();st.t=st.t||{};const x=st.t[q.t]||[0,0];x[0]+=good?1:0;x[1]++;st.t[q.t]=x;save(st);
 $('#hs').textContent=G.xp;$('#hst').textContent=G.st;$('#pb').style.width=(G.i*10)+'%';
 $('#fb').innerHTML=`<div class="fb ${good?'ok':'no'}"><h3>${good?`Helyes! 🎉 +${pts} XP`+(G.st>2?` (🔥 ${G.st} sorozat)`:''):'Most nem sikerült 🙃'}</h3>
 <div>Helyes válasz:</div><div class="ans"><b>${ca}</b></div>
 <div><b>Szabály:</b> ${fmt(q.r)}</div><b>A megoldás lépései:</b>
 <ol>${q.s.map(s=>`<li>${fmt(s)}</li>`).join('')}</ol>
 <p><button class="btn" id="nx">${G.i>=10?'Eredmény megtekintése':'Következő feladat →'}</button></p></div>`;
 $('#nx').onclick=next;$('#nx').scrollIntoView({block:'nearest',behavior:'smooth'});
};
function finish(){
 const p=G.ok*10,[r,e]=p>=90?['Hatvány-mester','👑']:p>=70?['Azonosság-vadász','🏹']:p>=50?['Ügyes tanonc','🌱']:['Gyakorolj még egy kört!','💪'];
 const st=load();st.b=st.b||{};const bb=st.b[G.b]||{r:0,best:0},nb=G.xp>bb.best;
 bb.r++;if(nb)bb.best=G.xp;st.b[G.b]=bb;save(st);
 show('end');
 $('#end').innerHTML=`<p class="big">${e}</p><h2 style="text-align:center;margin:.2em">${r}</h2><p class="mu" style="text-align:center">${B[G.b].n}</p>
 <div class="stats"><div><b>${G.xp}</b>XP</div><div><b>${G.ok}/10</b>helyes válasz</div><div><b>${G.ms}</b>leghosszabb sorozat</div></div>
 ${nb?'<p style="text-align:center"><b>🏆 Új egyéni rekord ebben a blokkban!</b></p>':''}
 <p class="row" style="justify-content:center"><button class="btn" id="again">Új kör</button><button class="chip" id="hm">Főoldal</button></p>`;
 $('#again').onclick=()=>setup(G.b);$('#hm').onclick=home;
}
home();
</script>
</body>
</html>
