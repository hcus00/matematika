<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Matek appok – főoldal</title>
<style>
:root{--bg:#f6f7fb;--surface:#fff;--text:#1d2433;--muted:#5d6678;--line:#e1e5ef;--accent:#4f46e5;--accent-soft:#eceafd;--shadow:0 2px 10px rgba(30,40,80,.07);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12141c;--surface:#1b1f2b;--text:#eceef5;--muted:#9aa3b8;--line:#2b3144;--accent:#8b85ff;--accent-soft:#272a45;--shadow:none;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12141c;--surface:#1b1f2b;--text:#eceef5;--muted:#9aa3b8;--line:#2b3144;--accent:#8b85ff;--accent-soft:#272a45;--shadow:none;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.5}
.wrap{max-width:900px;margin:0 auto;padding:32px 20px 48px}
header{text-align:center;margin-bottom:28px}
.logo{font-size:44px;line-height:1}
h1{margin:8px 0 4px;font-size:clamp(26px,5vw,36px)}
header p{margin:0;color:var(--muted)}
.tabs{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:24px}
.tab{border:1px solid var(--line);background:var(--surface);color:var(--text);padding:10px 20px;border-radius:999px;font:inherit;font-weight:600;cursor:pointer;display:flex;gap:8px;align-items:center}
.tab:hover{border-color:var(--accent)}
.tab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.count{font-size:12px;background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:1px 8px}
.tab[aria-selected="true"] .count{background:rgba(255,255,255,.25);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.card{display:flex;flex-direction:column;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;text-decoration:none;color:inherit;box-shadow:var(--shadow);transition:transform .15s,border-color .15s}
a.card:hover{transform:translateY(-3px);border-color:var(--accent)}
.icon{font-size:34px}
.card h3{margin:0;font-size:19px}
.card p{margin:0;color:var(--muted);font-size:14px;flex:1}
.go{color:var(--accent);font-weight:600;font-size:14px}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);border:2px dashed var(--line);border-radius:16px;padding:40px 20px}
footer{margin-top:36px;text-align:center;color:var(--muted);font-size:13px}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div class="logo">📐</div>
  <h1>Matek appok</h1>
  <p>Válassz évfolyamot, és gyakorolj!</p>
</header>
<div class="tabs" role="tablist" id="tabs"></div>
<main class="grid" id="grid"></main>
<footer>Új app hozzáadása: a fájl elején lévő <code>APPS</code> listába kerül egy új sor.</footer>
</div>
<script>
/* ÚJ APP HOZZÁADÁSA: másolj be egy új sort ide.
   grade: 9–12, title, desc, url (az app linkje), icon (emoji) */
const APPS = [
  {grade:10, title:"Kombi-Kaland", desc:"Kombinatorika gyakorló: permutáció, variáció, kombináció kalandos feladatokkal.", url:"kombi-kaland/app.html", icon:"🧭"},
  {grade:10, title:"Hatványvadász", desc:"A hatványozás azonosságainak gyakorlása játékos formában.", url:"hatvanyvadasz/app.html", icon:"🎯"}
];
const GRADES=[9,10,11,12];
let current=10;
const tabs=document.getElementById('tabs'),grid=document.getElementById('grid');
function render(){
  tabs.innerHTML='';
  GRADES.forEach(g=>{
    const n=APPS.filter(a=>a.grade===g).length;
    const b=document.createElement('button');
    b.className='tab';b.setAttribute('role','tab');
    b.setAttribute('aria-selected',g===current);
    b.innerHTML=g+'. évfolyam <span class="count">'+n+'</span>';
    b.onclick=()=>{current=g;render()};
    tabs.appendChild(b);
  });
  const list=APPS.filter(a=>a.grade===current);
  grid.innerHTML='';
  if(!list.length){
    grid.innerHTML='<div class="empty">Ehhez az évfolyamhoz még nincs app. Hamarosan érkezik! 🚧</div>';
    return;
  }
  list.forEach(a=>{
    const el=document.createElement('a');
    el.className='card';el.href=a.url;el.target='_blank';el.rel='noopener';
    el.innerHTML='<div class="icon">'+a.icon+'</div><h3>'+a.title+'</h3><p>'+a.desc+'</p><span class="go">Megnyitás →</span>';
    grid.appendChild(el);
  });
}
render();
</script>
</body>
</html>
