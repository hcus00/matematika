<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Matek appok – főoldal</title>
<style>
:root{--bg:#f6f7fb;--surface:#fff;--text:#1d2433;--muted:#5d6678;--line:#e1e5ef;--accent:#4f46e5;--accent-soft:#eceafd;--shadow:0 2px 10px rgba(30,40,80,.07);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12141c;--surface:#1b1f2b;--text:#eceef5;--muted:#9aa3b8;--line:#2b3144;--accent:#8b85ff;--accent-soft:#272a45;--shadow:none;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12141c;--surface:#1b1f2b;--text:#eceef5;--muted:#9aa3b8;--line:#2b3144;--accent:#8b85ff;--accent-soft:#272a45;--shadow:none;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.5}
.wrap{max-width:900px;margin:0 auto;padding:32px 20px 48px}
header{text-align:center;margin-bottom:28px}
.logo{font-size:44px;line-height:1}
h1{margin:8px 0 4px;font-size:clamp(26px,5vw,36px)}
header p{margin:0;color:var(--muted)}
.tabs{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:24px}
.tab{border:1px solid var(--line);background:var(--surface);color:var(--text);padding:10px 20px;border-radius:999px;font:inherit;font-weight:600;cursor:pointer;display:flex;gap:8px;align-items:center}
.tab:hover{border-color:var(--accent)}
.tab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.count{font-size:12px;background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:1px 8px}
.tab[aria-selected="true"] .count{background:rgba(255,255,255,.25);color:#fff}
.sec{margin-bottom:32px}
.sec h2{font-size:20px;margin:0 0 14px;display:flex;align-items:center;gap:10px}
.sec h2::after{content:"";flex:1;height:1px;background:var(--line)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.card{display:flex;flex-direction:column;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;text-decoration:none;color:inherit;box-shadow:var(--shadow);transition:transform .15s,border-color .15s}
a.card:hover{transform:translateY(-3px);border-color:var(--accent)}
.icon{font-size:34px}
.card h3{margin:0;font-size:19px}
.card p{margin:0;color:var(--muted);font-size:14px;flex:1}
.go{color:var(--accent);font-weight:600;font-size:14px}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);border:2px dashed var(--line);border-radius:16px;padding:24px 20px}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div class="logo">📐</div>
  <h1>Matek appok</h1>
  <p>Válassz évfolyamot, és gyakorolj!</p>
</header>
<div class="tabs" role="tablist" id="tabs"></div>
<main id="main"></main>
</div>
<script>
/* ÚJ APP HOZZÁADÁSA: másolj be egy új sort ide.
   grade: 9–12, title, desc, folder (az app mappája, ékezet nélkül), icon (emoji)
   Az app a főoldal melletti mappában van: <folder>/app.html */
const APPS = [
  {grade:9, title:"Hatványmester", desc:"Hatványozás gyakorlása feladatokkal.", folder:"hatvanymester", icon:"⚡"},
  {grade:10, title:"Kombi-Kaland", desc:"Kombinatorika gyakorló: permutáció, variáció, kombináció kalandos feladatokkal.", folder:"kombi-kaland", icon:"🧭"},
  {grade:10, title:"Hatványvadász", desc:"A hatványozás azonosságainak gyakorlása játékos formában.", folder:"hatvanyvadasz", icon:"🎯"}
];
const GRADES=[9,10,11,12];
let current='all';
const tabs=document.getElementById('tabs'),main=document.getElementById('main');
function chip(label,val,n){
  const b=document.createElement('button');
  b.className='tab';b.setAttribute('role','tab');
  b.setAttribute('aria-selected',val===current);
  b.innerHTML=label+(n===null?'':' <span class="count">'+n+'</span>');
  b.onclick=()=>{current=val;render()};
  tabs.appendChild(b);
}
function render(){
  tabs.innerHTML='';
  chip('Mind','all',null);
  GRADES.forEach(g=>chip(g+'. évfolyam',g,APPS.filter(a=>a.grade===g).length));
  main.innerHTML='';
  GRADES.filter(g=>current==='all'||g===current).forEach(g=>{
    const sec=document.createElement('section');sec.className='sec';
    sec.innerHTML='<h2>'+g+'. évfolyam</h2>';
    const grid=document.createElement('div');grid.className='grid';
    const list=APPS.filter(a=>a.grade===g);
    if(!list.length) grid.innerHTML='<div class="empty">Ehhez az évfolyamhoz még nincs app. Hamarosan érkezik! 🚧</div>';
    list.forEach(a=>{
      const el=document.createElement('a');
      el.className='card';el.href=a.folder+'/app.html';
      el.innerHTML='<div class="icon">'+a.icon+'</div><h3>'+a.title+'</h3><p>'+a.desc+'</p><span class="go">Megnyitás →</span>';
      grid.appendChild(el);
    });
    sec.appendChild(grid);main.appendChild(sec);
  });
}
render();
</script>
</body>
</html>
