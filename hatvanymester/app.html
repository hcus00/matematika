<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hatványmester – 9. évfolyam</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{--paper:#fbfcff;--grid:#dbe6f6;--ink:#14213d;--soft:#5b6b8c;--hl:#ffd166;--ok:#06a77d;--bad:#ef476f;--gold:#d99100}
*{box-sizing:border-box}
body{margin:0;font-family:Nunito,system-ui,sans-serif;color:var(--ink);background-color:var(--paper);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px;line-height:1.5}
.wrap{max-width:980px;margin:0 auto;padding:16px}
.m{font-family:"Cambria Math","STIX Two Math","Latin Modern Math",Cambria,Georgia,serif}
sup{font-size:.62em;line-height:0}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 .15em;font-size:.9em}
.fr>span:first-child{border-bottom:2px solid currentColor;padding:0 .25em .05em}
.fr>span:last-child{padding:.05em .25em 0}
.top{display:flex;gap:16px;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;margin-bottom:12px}
h1{margin:0;font-size:34px;font-weight:900;letter-spacing:-.5px}
.top p{margin:0;color:var(--soft)}
.me{background:#fff;border:2px solid var(--ink);border-radius:14px;padding:10px 14px;min-width:280px;box-shadow:4px 4px 0 var(--ink)}
.me b{font-size:18px}
.bar{height:12px;border:2px solid var(--ink);border-radius:8px;background:var(--paper);margin:4px 0;overflow:hidden}
.bar span{display:block;height:100%;background:var(--hl);transition:width .4s}
.me small{color:var(--soft)}
nav{display:flex;gap:8px;margin:14px 0;flex-wrap:wrap}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--vio,#6a4c93);outline-offset:2px}
.tab{border:2px solid var(--ink);background:#fff;border-radius:999px;padding:6px 18px;font-weight:700}
.tab.on{background:var(--ink);color:#fff}
.btn{border:2px solid var(--ink);background:var(--ink);color:#fff;border-radius:12px;padding:10px 22px;font-weight:900;font-size:17px;box-shadow:3px 3px 0 var(--hl)}
.btn.ghost{background:#fff;color:var(--ink);box-shadow:none}
.lead{color:var(--soft);max-width:70ch}
.map{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.tc,.card{background:#fff;border:2px solid var(--ink);border-radius:14px;padding:14px;box-shadow:4px 4px 0 var(--ink)}
.tc h3,.card h3{margin:0 0 6px;font-size:19px}
.fm{display:inline-block;background:var(--hl);padding:2px 10px;border-radius:6px;font-size:20px}
.row{display:flex;gap:8px;align-items:center;margin-top:10px}
.row>b{width:84px;font-size:14px;flex:none}
.lv{flex:1;border:2px solid var(--ink);background:var(--paper);border-radius:10px;padding:4px 2px;display:flex;flex-direction:column;align-items:center;font-size:13px;font-weight:700}
.lv:hover{background:var(--hl)}
.lv em{font-style:normal;color:var(--gold);letter-spacing:1px}
.th{display:grid;grid-template-columns:repeat(auto-fill,minmax(420px,1fr));gap:16px}
.th .fm{font-size:26px;margin:4px 0 8px}
.th p{margin:6px 0}
.ex1{background:var(--paper);border-radius:8px;padding:4px 10px;margin:6px 0;font-size:20px}
.warn{border-left:5px solid var(--bad);padding:2px 10px;background:#fff5f7;margin-top:8px}
.note{background:#fff;border:2px dashed var(--ink);border-radius:14px;padding:12px 16px;margin-top:16px}
.bd{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.bg{background:#fff;border:2px solid var(--ink);border-radius:14px;padding:12px;text-align:center}
.bg.off{opacity:.45;border-style:dashed}
.bg .ic{font-size:34px}
.rt{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.dots{display:flex;gap:6px}
.dots span{width:16px;height:16px;border-radius:50%;border:2px solid var(--ink);background:#fff}
.dots .ok{background:var(--ok)}.dots .no{background:var(--bad)}.dots .cur{background:var(--hl)}
.chip{background:var(--hl);border:2px solid var(--ink);border-radius:999px;padding:2px 12px;font-weight:900}
.q{background:#fff;border:2px solid var(--ink);border-radius:14px;padding:18px;box-shadow:4px 4px 0 var(--ink)}
.expr{font-size:clamp(26px,5vw,40px);margin:14px 0;overflow-x:auto;padding:6px 0;line-height:2.1}
.num{font:700 28px "Cambria Math",Georgia,serif;width:7em;max-width:60%;border:2px solid var(--ink);border-radius:8px;padding:2px 8px;margin-left:8px}
.sx{position:relative;top:-.8em;margin:0 .1em}
.ex{font:700 18px "Cambria Math",Georgia,serif;width:3.2em;border:2px solid var(--ink);border-radius:6px;text-align:center;padding:2px}
.dot{margin:0 .2em}
.act{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}
.fb{margin-top:14px;padding:10px 14px;border-radius:10px;border:2px solid var(--ink);animation:pop .25s}
.fb.ok{background:#e3f8f1;border-color:var(--ok)}
.fb.bad{background:#fff0f3;border-color:var(--bad)}
.fb ul{margin:6px 0 0;padding-left:20px}
.fb ol,.stp{margin:6px 0 0;padding-left:22px}
.fb li,.stp li{margin:5px 0}
.fb small{color:var(--soft)}
.q .warn{margin:6px 0}
.hint{margin-top:10px;background:var(--paper);border:2px dashed var(--soft);border-radius:10px;padding:6px 14px}
.hint ul{margin:0;padding-left:20px}
.res{text-align:center;background:#fff;border:2px solid var(--ink);border-radius:14px;padding:24px;box-shadow:4px 4px 0 var(--ink)}
.big{font-size:64px;color:var(--gold);letter-spacing:6px}
@keyframes pop{from{transform:scale(.96);opacity:.5}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.fb{animation:none}.bar span{transition:none}}
@media (max-width:480px){.th{grid-template-columns:1fr}.map{grid-template-columns:1fr}.me{min-width:0;width:100%}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
/* ---------- feladatgenerátor ---------- */
const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1)),pick=a=>a[R(0,a.length-1)],e=R;

const stp=(f,to,r)=>({f,to,r});
const A=(s,x)=>{const h=S(s)+(x==1?'':`<sup>${ex(x)}</sup>`);return{t:'a',x,h,c:h,m:{[s]:x},r:[],s:[]}};
const P=(n,k)=>{
 const m=sc(n.m,k),at=n.t=='a'&&n.x==1,r=n.t=='m'?'prod':n.t=='f'?'frac':(n.t=='p'||(n.t=='a'&&n.x!=1))?'pp':null;
 const h=(at?n.h:`(${n.h})`)+`<sup>${ex(k)}</sup>`,c=mh(m),s=[...n.s];
 if(r=='frac'){const t=FR(mh(sc(n.a.m,k)),mh(sc(n.b.m,k)));s.push(stp(`(${n.c})<sup>${ex(k)}</sup>`,t,'frac'),stp(t,c,sh(n.a,n.b)?'div':'neg'))}
 else if(r)s.push(stp(`(${n.c})<sup>${ex(k)}</sup>`,c,r));
 return{t:'p',h,c,m,r:[...n.r,...(r?[r]:[])],s};
};
const M=(a,b)=>{
 const m=ad(a.m,b.m,1),ff=a.t=='f'&&b.t=='f',d=ff||sh(a,b),k=ff?'fmul':'mul',s=[...a.s,...b.s],h=a.h+'·'+b.h,c=d?mh(m):`${a.c}·${b.c}`;
 if(d)s.push(stp(`${a.c}·${b.c}`,c,k));
 return{t:'m',h,c,m,r:[...a.r,...b.r,...(d?[k]:[])],s};
};
const D=(a,b)=>{
 const m=ad(a.m,b.m,-1),d=sh(a,b),s=[...a.s,...b.s],h=FR(a.h,b.h),c=d?mh(m):FR(a.c,b.c);
 if(d)s.push(stp(FR(a.c,b.c),c,'div'));
 return{t:'d',h,c,m,r:[...a.r,...b.r,...(d?['div']:[])],s};
};
const DF=(a,b)=>{
 const m=ad(a.m,b.m,-1),c=mh(m),s=[...a.s,...b.s],rc=`${a.c}·${FR(b.b.c,b.a.c)}`;
 s.push(stp(`${a.c} : ${b.c}`,rc,'recip'),stp(rc,c,'fmul'));

};
const F=(a,b)=>({t:'f',h:FR(a.h,b.h),c:FR(a.c,b.c),m:ad(a.m,b.m,-1),r:[...a.r,...b.r],s:[...a.s,...b.s],a,b});
const TPL={
pp:[[x=>P(A(x,e(2,5)),e(2,4))],
 [x=>M(P(A(x,e(2,4)),e(2,3)),A(x,e(2,6))),x=>D(P(A(x,e(2,4)),e(2,4)),A(x,e(2,5))),(x,y)=>M(P(A(x,e(2,4)),e(2,3)),P(A(y,e(2,4)),e(2,3)))],
 [x=>P(P(A(x,e(2,3)),e(2,3)),e(2,3)),x=>D(P(A(x,e(2,5)),e(2,4)),P(A(x,e(2,4)),e(2,3))),(x,y)=>M(P(A(x,e(2,4)),e(2,3)),D(P(A(y,e(2,5)),e(2,3)),A(y,e(2,6)))),x=>D(M(P(A(x,3),2),A(x,e(2,4))),P(A(x,e(2,4)),2))]],
mul:[[x=>M(A(x,e(2,6)),A(x,e(2,6)))],
 [x=>M(M(A(x,e(1,4)),A(x,e(1,4))),A(x,e(1,4))),(x,y)=>M(M(A(x,e(2,4)),A(y,e(2,4))),M(A(x,e(1,3)),A(y,e(1,3)))),(x,y)=>M(M(A(x,e(2,4)),A(y,e(1,3))),A(x,e(2,4)))],
 [x=>D(M(A(x,e(2,5)),A(x,e(2,5))),A(x,e(2,6))),(x,y)=>M(P(A(x,e(2,3)),2),M(A(x,e(2,4)),A(y,e(1,3)))),x=>M(M(A(x,e(2,4)),P(A(x,e(1,3)),2)),D(A(x,e(5,7)),A(x,e(2,3))))]],
div:[[x=>{const m=e(1,4);return D(A(x,m+e(1,4)),A(x,m))}],
 [x=>D(M(A(x,e(2,4)),A(x,e(2,4))),A(x,e(2,4))),(x,y)=>M(D(A(x,e(3,7)),A(x,e(1,3))),D(A(y,e(3,7)),A(y,e(1,3)))),x=>D(A(x,e(5,9)),M(A(x,e(1,3)),A(x,e(1,3))))],
 [x=>D(A(x,e(2,4)),A(x,e(5,8))),(x,y)=>D(M(A(x,e(3,6)),A(y,e(2,4))),M(A(x,e(2,5)),A(y,e(3,6)))),x=>D(P(A(x,e(2,3)),e(2,3)),M(A(x,e(2,3)),A(x,e(3,4))))]],
prod:[[(x,y)=>P(M(A(x,1),A(y,1)),e(2,4))],
 [(x,y)=>P(M(A(x,e(2,3)),A(y,e(2,3))),e(2,3)),(x,y)=>P(M(A(x,1),A(y,e(2,3))),e(2,4)),(x,y)=>M(P(M(A(x,1),A(y,1)),e(2,3)),A(x,e(1,3)))],
 [(x,y)=>D(P(M(A(x,e(2,3)),A(y,e(2,3))),e(2,3)),M(A(x,e(1,3)),A(y,e(1,2)))),(x,y)=>M(P(M(A(x,2),A(y,1)),3),P(M(A(x,1),A(y,3)),2)),(x,y)=>P(M(P(A(x,e(2,3)),2),A(y,e(1,3))),e(2,3))]],
frac:[[(x,y)=>P(F(A(x,1),A(y,1)),e(2,4))],
 [(x,y)=>P(F(A(x,e(2,3)),A(y,e(1,3))),e(2,3)),(x,y)=>P(F(A(x,1),A(y,e(2,3))),e(2,4)),(x,y)=>M(P(F(A(x,1),A(y,1)),e(2,3)),A(y,e(1,4)))],
 [(x,y)=>D(P(F(A(x,e(2,3)),A(y,e(2,3))),e(2,3)),A(x,e(2,4))),(x,y)=>M(P(F(A(x,2),A(y,1)),e(2,3)),P(F(A(y,3),A(x,1)),2)),(x,y)=>P(F(M(A(x,e(1,2)),A(y,e(1,2))),P(A(y,e(1,2)),2)),e(2,3))]]
};
const nE=(a,b)=>-e(a,b);
const fm1=(x,y)=>M(F(M(A(x,e(2,4)),A(x,e(1,3))),P(A(y,e(1,3)),2)),F(P(A(y,e(2,3)),2),A(x,e(1,3))));
const fm2=(x,y)=>M(F(P(M(A(x,e(1,2)),A(y,e(1,2))),2),A(y,e(2,4))),F(A(x,e(2,3)),M(A(x,e(1,2)),P(A(y,e(1,2)),2))));
const fm3=(x,y)=>M(F(M(A(x,nE(1,3)),A(y,e(2,3))),P(A(x,e(1,2)),2)),F(P(A(y,nE(1,2)),2),A(x,e(1,3))));
const fd1=(x,y)=>DF(F(M(A(x,e(2,4)),A(x,e(1,3))),A(y,e(2,3))),F(P(A(x,e(1,3)),2),M(A(y,e(1,2)),A(y,e(1,3)))));
const fd2=(x,y)=>DF(F(P(A(x,e(2,3)),e(2,3)),M(A(y,e(2,3)),A(y,e(1,2)))),F(A(x,e(2,4)),P(A(y,e(2,3)),2)));
const fd3=(x,y)=>DF(F(M(A(x,e(2,4)),P(A(y,e(1,2)),2)),A(x,e(1,3))),F(P(M(A(x,1),A(y,1)),2),A(y,e(2,3))));
TPL.pp[1].push(x=>P(A(x,nE(1,4)),e(2,3)),x=>M(P(A(x,e(2,4)),e(2,3)),A(x,nE(2,6))),(x,y)=>M(P(A(x,e(2,4)),0),A(y,e(2,4))));
TPL.mul[1].push(x=>M(A(x,nE(1,4)),A(x,e(2,6))),x=>M(A(x,nE(2,4)),A(x,nE(1,3))),(x,y)=>M(M(A(x,e(2,4)),A(y,nE(1,3))),A(x,nE(1,3))));
TPL.div[1].push(x=>D(A(x,nE(1,3)),A(x,e(2,4))),x=>D(A(x,e(2,4)),A(x,nE(1,3))),x=>{const n=e(2,5);return D(A(x,n),A(x,n))});
TPL.prod[1].push((x,y)=>P(M(A(x,nE(1,3)),A(y,e(1,3))),e(2,3)),(x,y)=>P(M(A(x,e(1,3)),A(y,e(1,3))),nE(1,2)));
TPL.frac[1].push((x,y)=>P(F(A(x,e(1,3)),A(y,e(1,3))),nE(1,3)),(x,y)=>P(F(A(x,nE(1,3)),A(y,e(1,3))),e(2,3)));
TPL.pp[2].push((x,y)=>M(P(A(x,nE(1,3)),e(2,3)),D(A(y,e(2,4)),P(A(y,nE(1,2)),2))),x=>D(P(A(x,e(2,3)),nE(1,2)),P(A(x,nE(1,3)),e(2,3))));
TPL.mul[2].push((x,y)=>M(M(A(x,nE(2,4)),P(A(y,e(1,3)),-2)),M(A(x,e(3,6)),A(y,e(2,4)))),x=>M(M(A(x,nE(1,3)),A(x,0)),D(A(x,e(2,4)),A(x,nE(1,3)))),fm1);
TPL.div[2].push((x,y)=>D(M(A(x,nE(1,3)),A(y,e(2,4))),M(A(x,nE(2,4)),A(y,nE(1,3)))),x=>D(P(A(x,nE(1,3)),e(2,3)),M(A(x,0),A(x,nE(1,3)))),fd1);
TPL.prod[2].push((x,y)=>D(P(M(A(x,nE(1,3)),A(y,e(2,3))),nE(1,2)),M(A(x,e(1,3)),A(y,nE(1,2)))));
TPL.frac[2].push((x,y)=>M(P(F(A(x,nE(1,3)),A(y,e(1,2))),nE(1,2)),A(x,e(2,4))),fm1,fm2,fm3,fd1,fd2,fd3);
const LT=['a','b','c','x','y','z','m','n','p','q'],NB=[2,2,3,3,5,10];
const gcd=(a,b)=>b?gcd(b,a%b):a;
function two(p){const x=pick(p);let y=pick(p);while(y==x)y=pick(p);return[String(x),String(y)]}
function gen(topic,tier,mode,seen){
 for(let i=0;i<600;i++){
  const tp=topic=='mix'?pick(['pp','mul','div','prod','frac']):topic;
  const [x,y]=two(mode=='num'?NB:LT);
  const n=pick(TPL[tp][tier])(x,y),ks=Object.keys(n.m);
  const z=ks.filter(k=>n.m[k]==0).length;if(seen.has(n.h)||z==ks.length||(z&&tier==0))continue;
  if(!(tier>0||tp=='frac')&&ks.some(k=>n.m[k]<0))continue;
  let N=1,D2=1;
  if(mode=='num'){
   for(const k of ks){const v=n.m[k];if(v>0)N*=k**v;else D2*=k**-v}
   const c=tier>1?[40000,3000]:[5000,500];if(N>c[0]||D2>c[1])continue;
   const g=gcd(N,D2);N/=g;D2/=g;
  }
  return{tp,n,N,D:D2,mode,h:n.h};
 }
}
const RN={pp:['Hatvány hatványozása','(a<sup>n</sup>)<sup>k</sup> = a<sup>n·k</sup>'],mul:['Azonos alapú hatványok szorzása','a<sup>n</sup>·a<sup>m</sup> = a<sup>n+m</sup>'],div:['Azonos alapú hatványok osztása',FR('a<sup>n</sup>','a<sup>m</sup>')+' = a<sup>n−m</sup>'],prod:['Szorzat hatványozása','(a·b)<sup>n</sup> = a<sup>n</sup>·b<sup>n</sup>'],frac:['Tört hatványozása','('+FR('a','b')+')<sup>n</sup> = '+FR('a<sup>n</sup>','b<sup>n</sup>')],fmul:['Törtek szorzása',FR('a','b')+'·'+FR('c','d')+' = '+FR('a·c','b·d')],recip:['Tört osztása',FR('a','b')+' : '+FR('c','d')+' = '+FR('a','b')+'·'+FR('d','c')]};
const rules=q=>[...new Set(q.n.r)].map(r=>`<li><b>${RN[r][0]}:</b> <span class="m">${RN[r][1]}</span></li>`).join('');
const mono=q=>mh(q.n.m);
const valTxt=q=>q.D==1?`${q.N}`:`${q.N}/${q.D}`;
const RG={pp:'Hatvány hatványozása: a kitevőket összeszorozzuk.',mul:'Azonos alapú hatványok szorzása: a kitevőket összeadjuk.',div:'Azonos alapú hatványok osztása: a számláló kitevőjéből kivonjuk a nevező kitevőjét.',prod:'Szorzat hatványozása: minden tényezőt hatványozunk, a kitevők szorzódnak.',frac:'Tört hatványozása: a számlálót és a nevezőt is hatványozzuk.',neg:`Átírás negatív kitevővel: ${FR(1,'a<sup>n</sup>')} = a<sup>−n</sup>, illetve ${FR(1,'a<sup>−n</sup>')} = a<sup>n</sup>.`,coll:'Összegyűjtjük az egyes alapok hatványait.',fmul:'Törtek szorzása: a számlálókat és a nevezőket is összeszorozzuk, majd összevonjuk az azonos alapú hatványokat.',recip:'Tört osztása: az osztó reciprokával szorzunk (az osztó számlálóját és nevezőjét felcseréljük).',val:'Kiszámoljuk az értéket; törtnél a legegyszerűbb alakot adjuk meg.'};
function guide(q){
 const s=[...q.n.s],fin=mh(q.n.m);
 if(q.n.c!==fin&&!(s.length&&s[s.length-1].to===fin))s.push(stp(q.n.c,fin,'coll'));

 return `<div style="margin-top:8px"><b>A megoldás menete:</b> haladj belülről kifelé: előbb a zárójeles hatványozásokat végezd el, utána az azonos alapú szorzásokat és osztásokat.<ol>${s.map(x=>`<li><span class="m">${x.f} = ${x.to}</span><br><small>${RG[x.r]}</small></li>`).join('')}</ol>${Object.values(q.n.m).some(v=>v<=0)?`<small class="m">Emlékeztető: a<sup>0</sup> = 1, és a<sup>−n</sup> = ${FR(1,'a<sup>n</sup>')}.</small>`:''}</div>`;
}
function parseNum(s){s=s.replace(/\s/g,'').replace('−','-').replace(',','.');if(!s)return NaN;if(s.includes('/')){const[a,b]=s.split('/');return +b?+a/+b:NaN}return +s}
const okNum=(q,s)=>Math.abs(parseNum(s)-q.N/q.D)<1e-9*Math.max(1,q.N/q.D);
const toInt=s=>{s=s.trim().replace('−','-');return /^[-+]?\d+$/.test(s)?+s:NaN};
</script>

 <section class="card" style="margin-top:16px"><h3>Negatív egész kitevő és nulla kitevő</h3>

 }else{const ins=[...document.querySelectorAll('.ex')];empty=ins.some(i=>!i.value.trim());ok=!empty&&ins.every(i=>toInt(i.value)===q.n.m[i.dataset.k])}
 if(empty){fb.innerHTML='<div class="fb bad">Előbb töltsd ki az összes mezőt!</div>';return}

 }

 document.querySelectorAll('input').forEach(i=>i.disabled=true);
 fb.innerHTML=h;$('#cmb').textContent=`Kombó ×${rd.combo}`;
 const go=$('#go');go.textContent=rd.res.length>=5?'Eredmény':'Következő feladat';go.dataset.act='nxt';go.focus();rd.done=true;
 document.querySelectorAll('.dots span').forEach((s,j)=>{s.className=j<rd.res.length?(rd.res[j]?'ok':'no'):j==rd.res.length?'cur':''});

}
document.addEventListener('click',ev=>{
 const g=ev.target.closest('[data-go]'),v=ev.target.closest('[data-v]'),a=ev.target.closest('[data-act]');
 if(g)return start(g.dataset.go);
 if(v){view=v.dataset.v;return render()}
 if(a){
  if(a.dataset.act=='chk')check();
  else if(a.dataset.act=='nxt')nextQ();
  else if(a.dataset.act=='hint'&&!rd.done){rd.hint=true;$('#hint').innerHTML=`<div class="hint"><b>Ezeket az azonosságokat használd:</b><ul>${rules(rd.q)}</ul></div>`}
 }
});
document.addEventListener('keydown',ev=>{
 if(ev.key=='Enter'&&view=='round'){ev.preventDefault();const b=$('#go');b&&b.click()}
});
render();
</script>
</body>
</html>
